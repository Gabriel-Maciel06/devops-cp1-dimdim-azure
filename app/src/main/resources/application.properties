# ===================================================================
# Configurações do Spring Boot - DimDim Finanças API
# ===================================================================
spring.application.name=dimdim-api
server.port=8080

# ===================================================================
# Banco de Dados PostgreSQL (Configurado via Variáveis de Ambiente)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dimdim_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:dimdim_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:dimdim_pass123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Hibernate & JPA
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Swagger / OpenAPI
# ===================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
